name: Publish CLI

# Publishes @deniai/flixa (apps/cli), @deniai/openclaw-flixa (apps/openclaw-flixa), and the
# Flixa Ship skill (skills/flixa-ship).
#
# - push to main touching the CLI, the OpenClaw plugin, the skill, or the shared API client
#   -> canary release ({version}-canary.{run_number}, npm dist-tag "canary")
# - cli-v* tag -> stable release
#
# npm uses trusted publishing (OIDC provenance, no NPM_TOKEN secret). NOTE: the npm trusted
# publisher for @deniai/flixa and @deniai/openclaw-flixa is still configured for
# deniaiapp/flixa-cli. It must be re-pointed to deniaiapp/flixa (workflow publish-cli.yml)
# before this workflow can publish.

on:
  push:
    branches:
      - main
    paths:
      - "apps/cli/**"
      - "apps/openclaw-flixa/**"
      - "skills/**"
      - "packages/api-client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/publish-cli.yml"
    tags:
      - "cli-v*"

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read CLI package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the CLI version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "cli-v${{ steps.package.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${{ steps.package.outputs.version }}." >&2
            exit 1
          fi

      - name: Set canary version
        if: github.ref_type == 'branch'
        working-directory: apps/cli
        run: npm version "${{ steps.package.outputs.version }}-canary.${{ github.run_number }}" --no-git-tag-version

      - name: Build CLI
        run: pnpm --filter @deniai/flixa run build

      - name: Build OpenClaw plugin
        env:
          FLIXA_RELEASE_VERSION: ${{ github.ref_type == 'branch' && format('{0}-canary.{1}', steps.package.outputs.version, github.run_number) || steps.package.outputs.version }}
        run: pnpm --filter @deniai/openclaw-flixa run build

      # `pnpm pack` rewrites workspace: protocol specifiers (the bundled API client) before npm
      # publishes the tarball with provenance.
      - name: Pack CLI
        working-directory: apps/cli
        run: pnpm pack --out flixa-cli.tgz

      - name: Publish canary
        if: github.ref_type == 'branch'
        working-directory: apps/cli
        run: npm publish flixa-cli.tgz --tag canary --access public --provenance

      - name: Publish OpenClaw plugin canary
        if: github.ref_type == 'branch'
        working-directory: apps/openclaw-flixa
        run: npm publish --tag canary --access public --provenance

      - name: Publish OpenClaw plugin to ClawHub canary
        if: github.ref_type == 'branch'
        working-directory: apps/openclaw-flixa
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "CLAWHUB_TOKEN is required to publish the OpenClaw plugin to ClawHub." >&2
            exit 1
          fi
          npx --yes clawhub@0.23.3 login --token "${CLAWHUB_TOKEN}" --no-browser
          npx --yes clawhub@0.23.3 package publish . \
            --family code-plugin \
            --name "@deniai/openclaw-flixa" \
            --owner deniai \
            --version "${VERSION}-canary.${RUN_NUMBER}" \
            --tags canary \
            --source-repo deniaiapp/flixa \
            --source-commit "${GITHUB_SHA}" \
            --source-path apps/openclaw-flixa \
            --wait \
            --json

      - name: Publish Flixa Ship skill to ClawHub canary
        if: github.ref_type == 'branch'
        working-directory: skills/flixa-ship
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "CLAWHUB_TOKEN is required to publish the Flixa Ship skill to ClawHub." >&2
            exit 1
          fi
          npx --yes clawhub@0.23.3 login --token "${CLAWHUB_TOKEN}" --no-browser
          npx --yes clawhub@0.23.3 skill publish . \
            --slug flixa-ship \
            --name "Flixa Ship" \
            --owner deniai \
            --version "${VERSION}-canary.${RUN_NUMBER}" \
            --tags canary \
            --topics coding,ship,verification \
            --changelog "Flixa Ship canary ${VERSION}-canary.${RUN_NUMBER}" \
            --source-repo deniaiapp/flixa \
            --source-commit "${GITHUB_SHA}" \
            --source-path skills/flixa-ship \
            --json

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: apps/cli
        run: npm publish flixa-cli.tgz --access public --provenance

      - name: Publish OpenClaw plugin release
        if: github.ref_type == 'tag'
        working-directory: apps/openclaw-flixa
        run: npm publish --access public --provenance

      - name: Publish OpenClaw plugin to ClawHub release
        if: github.ref_type == 'tag'
        working-directory: apps/openclaw-flixa
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "CLAWHUB_TOKEN is required to publish the OpenClaw plugin to ClawHub." >&2
            exit 1
          fi
          npx --yes clawhub@0.23.3 login --token "${CLAWHUB_TOKEN}" --no-browser
          npx --yes clawhub@0.23.3 package publish . \
            --family code-plugin \
            --name "@deniai/openclaw-flixa" \
            --owner deniai \
            --version "${VERSION}" \
            --tags latest \
            --source-repo deniaiapp/flixa \
            --source-commit "${GITHUB_SHA}" \
            --source-path apps/openclaw-flixa \
            --wait \
            --json

      - name: Publish Flixa Ship skill to ClawHub release
        if: github.ref_type == 'tag'
        working-directory: skills/flixa-ship
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ steps.package.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "CLAWHUB_TOKEN is required to publish the Flixa Ship skill to ClawHub." >&2
            exit 1
          fi
          npx --yes clawhub@0.23.3 login --token "${CLAWHUB_TOKEN}" --no-browser
          npx --yes clawhub@0.23.3 skill publish . \
            --slug flixa-ship \
            --name "Flixa Ship" \
            --owner deniai \
            --version "${VERSION}" \
            --tags latest \
            --topics coding,ship,verification \
            --changelog "Flixa Ship ${VERSION}" \
            --source-repo deniaiapp/flixa \
            --source-commit "${GITHUB_SHA}" \
            --source-path skills/flixa-ship \
            --json
