name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workspace:
    name: Workspace (typecheck, lint, format, test, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Verify the OpenClaw integration contract
        run: pnpm --filter @deniai/flixa run openclaw:check

      - name: Smoke-load the OpenClaw plugin runtime
        run: pnpm --filter @deniai/openclaw-flixa run smoke

      - name: Check the ACP registry manifest matches the Zed package
        run: pnpm --filter @deniai/flixa-zed acp:check

      - name: Package the VS Code extension (no publish)
        working-directory: apps/vscode
        run: pnpm exec vsce package --no-dependencies --out flixa.vsix

  cli-windows:
    name: Flixa CLI (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CLI, build, and integration contract
        working-directory: apps/cli
        run: pnpm run typecheck && pnpm run lint && pnpm run build && pnpm run openclaw:check
